name: Restore OG image
on:
  push:
    paths:
      - 'og-image.b64.part*'
      - '.github/workflows/restore-og.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG
        run: |
          python3 - <<'PY'
          import base64, pathlib, hashlib, glob
          parts = sorted(glob.glob('og-image.b64.part*'))
          raw = ''.join(pathlib.Path(p).read_text().strip() for p in parts)
          data = base64.b64decode(raw + ('=' * (-len(raw) % 4)))
          digest = hashlib.sha256(data).hexdigest()
          print('parts', parts, 'bytes', len(data), 'sha256', digest)
          expect = '0c56baf3a4e6beb02550b9ed4068658f4a20ab55ab0db392b0e9a8c3c6c97530'
          if digest != expect:
              raise SystemExit('checksum mismatch')
          pathlib.Path('og-image.png').write_bytes(data)
          PY
          file og-image.png
          ls -la og-image.png
      - name: Commit PNG if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.png
          git diff --staged --quiet && echo "No change" && exit 0
          git commit -m "Restore og-image.png from og-image.b64 parts"
          git push
