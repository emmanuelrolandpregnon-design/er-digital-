<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#EDE7DC">
  <title>Page introuvable — ER Digital</title>
  <link rel="icon" type="image/png" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@700&display=swap">
  <style>
  :root{--bg:#EDE7DC;--ink:#1A1614;--muted:#635A50;--orange:#E8522B;--yellow:#F4C430;--display:'Archivo Black','Arial Black',sans-serif;--body:'Space Grotesk',Arial,sans-serif;--mono:'Space Mono',monospace}
  @media(prefers-color-scheme:dark){:root{--bg:#1A1614;--ink:#EDE7DC;--muted:#B7AC9F}}
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px}
  main{width:min(100%,640px);border:2px solid var(--ink);padding:clamp(24px,6vw,48px);box-shadow:8px 8px 0 var(--ink)}
  .code{font:700 13px/1.4 var(--mono);letter-spacing:.04em;display:inline-block;background:var(--yellow);color:#1A1614;border:1.5px solid #1A1614;padding:6px 10px;margin:0 0 24px}
  h1{margin:0;font:400 clamp(38px,11vw,68px)/1.03 var(--display);letter-spacing:-.05em;text-transform:uppercase}
  h1 mark{background:var(--orange);color:#1A1614;padding:0 .06em}
  p{color:var(--muted);font-size:17px;max-width:40ch;margin:22px 0 28px}
  .actions{display:flex;flex-wrap:wrap;gap:12px}
  .button{display:inline-flex;align-items:center;min-height:52px;padding:14px 20px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font:700 12px/1.4 var(--body);letter-spacing:.025em;text-transform:uppercase;text-decoration:none;transition:background .18s,transform .18s,box-shadow .18s}
  .button:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink);background:var(--orange);color:#1A1614}
  .button.secondary{background:transparent;color:var(--ink)}
  .button.secondary:hover{background:var(--yellow);color:#1A1614}
  :focus-visible{outline:3px solid var(--orange);outline-offset:4px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <span class="code">Erreur 404</span>
    <h1>Cette page <mark>n’existe pas.</mark></h1>
    <p>Le lien est peut-être incorrect, ou la page a été déplacée. Revenez à l’accueil ou écrivez-nous directement.</p>
    <div class="actions">
      <a class="button" href="/">Retour à l’accueil</a>
      <a class="button secondary" href="https://wa.me/2250575370929?text=Bonjour%2C%20je%20souhaite%20discuter%20de%20mon%20site%20avec%20ER%20Digital." target="_blank" rel="noopener noreferrer">Écrire sur WhatsApp</a>
    </div>
  </main>
</body>
</html>
