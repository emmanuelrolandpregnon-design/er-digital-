<style>
:root{--bg:#06141B;--s:#11212D;--b:#253745;--t:#CCD0CF;--m:#9BA8AB;--a:#3DBDAA}
@media (prefers-color-scheme:light){:root{--bg:#F3F7F6;--s:#fff;--b:#B8C9C5;--t:#11212D;--m:#546A6B;--a:#0F6F63}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{width:min(760px,calc(100% - 2rem));margin:0 auto;padding:2rem 0 4rem}
a{color:var(--a);font-weight:700}a:focus-visible{outline:3px solid var(--a);outline-offset:3px}
h1{font-size:clamp(2rem,8vw,3rem);line-height:1.1;letter-spacing:-.03em;margin:1.5rem 0 .5rem}
h2{font-size:1.2rem;margin:2rem 0 .4rem}p,li{color:var(--m)}.updated{font-size:.9rem}
ul{padding-left:1.2rem}.todo{font-style:italic}
</style>
<style>.c{min-height:80vh;display:grid;place-content:center;text-align:left}.big{font-size:clamp(4rem,22vw,9rem);font-weight:900;color:var(--a);line-height:1}.btn{display:inline-block;margin-top:1rem;padding:.85rem 1.2rem;border-radius:.7rem;background:#3DBDAA;color:#06141B;text-decoration:none;font-weight:900}</style>
</head>
<body>
<main class="wrap c">

</main>
</body>
